name: Build apps

# Builds the Windows installer (.exe) and the Android app (.apk) from the same
# web UI, then publishes both on a GitHub release:
#   https://github.com/<owner>/<repo>/releases/latest/download/Instinct-Setup.exe
#   https://github.com/<owner>/<repo>/releases/latest/download/Instinct.apk
#
# No GitHub secrets are needed: scripts/provision.mjs trades this workflow's
# GitHub OIDC token for the app key (APP_KEY) and the Android signing keystore
# (ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD), which live as environment
# variables on Vercel. The server only answers this repository's apps workflow.
# Optional repository variable MIDO_API_BASE (defaults to https://mido-instinct.vercel.app).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - index.html
      - assets/**
      - desktop/**
      - mobile/**
      - scripts/**
      - package.json
      - .github/workflows/apps.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  MIDO_API_BASE: ${{ vars.MIDO_API_BASE || 'https://mido-instinct.vercel.app' }}
  MIDO_APP_KEY: ${{ secrets.MIDO_APP_KEY }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Load build settings
        run: node scripts/provision.mjs
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Collect
        shell: bash
        run: cp desktop/dist/Instinct-Setup-*.exe Instinct-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Instinct-Setup.exe
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Load build settings
        run: node scripts/provision.mjs
      - name: Install
        working-directory: mobile
        run: npm ci
      - name: Generate Android project
        working-directory: mobile
        run: |
          set -o pipefail
          npm run prepare-web
          npx cap add android
          npm run android:assets
          npx cap sync android 2>&1 | tee "$RUNNER_TEMP/gen.log" || { echo "::error title=cap sync failed::$(tail -n 30 "$RUNNER_TEMP/gen.log" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Build APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          report() { echo "::error title=Android build failed::$( (grep -A25 "What went wrong" "$RUNNER_TEMP/build.log" || tail -n 40 "$RUNNER_TEMP/build.log") | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log" || report
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$ANDROID_KEYSTORE_FILE" --ks-type PKCS12 --ks-key-alias instinct \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
              --out "$GITHUB_WORKSPACE/Instinct.apk" "$RUNNER_TEMP/aligned.apk" 2>&1 | tee "$RUNNER_TEMP/build.log" || report
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Instinct.apk" | head -3
          else
            echo "::warning::No Android keystore on Vercel, building a debug APK"
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log" || report
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Instinct.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Instinct.apk
          if-no-files-found: error
          retention-days: 90

  # The apps carry the app key, so they are never published. They stay as private
  # workflow artifacts: Actions → this run → Artifacts.
  summary:
    name: Downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Apps are ready"
            echo "Download **windows** (Instinct-Setup.exe) and **android** (Instinct.apk) from the Artifacts section below."
            echo "They open without the passkey, so keep them to yourself."
          } >> "$GITHUB_STEP_SUMMARY"
